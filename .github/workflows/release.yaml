name: Release

on:
    push:
        tags: ['v*.*.*']

jobs:
    ci:
        uses: ./.github/workflows/ci.yaml

    publish:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write # npm trusted publishing and provenance
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            # trusted publishing needs a newer npm than some node releases bundle
            - run: npm install --global npm@latest
            # npm, not pnpm: npm reads the trusted publishing oidc token and adds provenance itself
            - run: npm publish
            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
