name: Grok

# runs grokdex against the newest grok cli and a fake chatgpt plan route. no logins or secrets: grok
# takes a fake token from grokdex, and only the fake route accepts it.

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '17 8 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: grok-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-slim
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.version }}
            cache-key: ${{ steps.version.outputs.cache-key }}
            should-run: ${{ github.event_name != 'schedule' || steps.checked.outputs.cache-hit != 'true' }}
        steps:
            - name: Resolve the stable Grok version
              id: version
              shell: bash
              run: |
                  version=$(curl --fail --silent --show-error --location --retry 3 --max-time 30 https://x.ai/cli/stable | tr -d '\r\n')

                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
                      echo "invalid Grok version: $version" >&2
                      exit 1
                  fi

                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "cache-key=grok-checked-v1-$version" >> "$GITHUB_OUTPUT"
                  echo "Grok version: $version" >> "$GITHUB_STEP_SUMMARY"

            - name: Look up the previously checked version
              id: checked
              uses: actions/cache/restore@v6
              with:
                  path: ${{ runner.temp }}/grok-checked
                  key: ${{ steps.version.outputs.cache-key }}
                  lookup-only: true

            - name: Report an unchanged version
              if: github.event_name == 'schedule' && steps.checked.outputs.cache-hit == 'true'
              run: echo "This Grok version has already been checked; skipping compatibility jobs." >> "$GITHUB_STEP_SUMMARY"

    compatibility:
        needs: release
        if: needs.release.outputs.should-run == 'true'
        name: Grok ${{ needs.release.outputs.version }} (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        env:
            GROK_VERSION: ${{ needs.release.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Grok (macOS, Linux)
              if: runner.os != 'Windows'
              run: |
                  curl -fsSL https://x.ai/cli/install.sh | bash -s -- "$GROK_VERSION"
                  echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

            - name: Install Grok (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  irm https://x.ai/cli/install.ps1 | iex
                  "$env:USERPROFILE\.grok\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Grok version
              run: grok --version

            - name: Test
              run: pnpm test

    checked:
        needs: [release, compatibility]
        # remember failed checks too, so an unchanged release does not start the suite every day.
        # manual runs and code changes still run the suite regardless of this marker.
        if: >-
            always() && needs.release.result == 'success' &&
            (needs.compatibility.result == 'success' || needs.compatibility.result == 'failure')
        runs-on: ubuntu-slim
        timeout-minutes: 5
        steps:
            - name: Record the checked version
              env:
                  GROK_VERSION: ${{ needs.release.outputs.version }}
              run: |
                  mkdir -p "$RUNNER_TEMP/grok-checked"
                  printf '%s\n' "$GROK_VERSION" > "$RUNNER_TEMP/grok-checked/version"

            - name: Save the checked version
              uses: actions/cache/save@v6
              with:
                  path: ${{ runner.temp }}/grok-checked
                  key: ${{ needs.release.outputs.cache-key }}
