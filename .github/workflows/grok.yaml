name: Grok

# runs grokdex against the newest grok cli and a fake chatgpt plan route. no logins or secrets: grok
# takes a fake token from grokdex, and only the fake route accepts it. the nightly run catches a new
# grok release breaking grokdex before anyone hits it mid-session.

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '0 8 * * *'
    workflow_dispatch:

jobs:
    compatibility:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install the latest Grok (macOS, Linux)
              if: runner.os != 'Windows'
              run: |
                  curl -fsSL https://x.ai/cli/install.sh | bash
                  echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

            - name: Install the latest Grok (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  irm https://x.ai/cli/install.ps1 | iex
                  "$env:USERPROFILE\.grok\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Grok version
              run: grok --version

            - name: Test
              run: pnpm test
